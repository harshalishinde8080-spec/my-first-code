<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De-Influenced</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans p-4 sm:p-8 max-w-md mx-auto selection:bg-red-500">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8 border-b border-zinc-900 pb-4">
        <h1 class="text-lg font-black tracking-tighter uppercase text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-500">De•Influenced</h1>
        <button onclick="document.getElementById('f').classList.toggle('hidden')" class="bg-zinc-100 hover:bg-white text-black text-[11px] font-bold uppercase px-3 py-1.5 rounded-md transition-all active:scale-95">Log Regret</button>
    </header>

    <!-- Search & Input Form -->
    <main class="space-y-4">
        <input type="text" id="s" onkeyup="draw()" placeholder="Search viral products..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500">

        <div id="f" class="hidden bg-zinc-900 border border-red-950 p-4 rounded-xl space-y-3">
            <input type="text" id="n" placeholder="Product Name" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs focus:outline-none text-white">
            <input type="text" id="r" placeholder="Why you regret it" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs focus:outline-none text-white">
            <input type="number" id="sc" placeholder="Regret Score % (1-100)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs focus:outline-none text-white">
            <button onclick="add()" class="w-full bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold uppercase py-2 rounded-lg transition-colors">Publish</button>
        </div>

        <!-- Live Registry List -->
        <div id="l" class="space-y-2 pt-2"></div>
    </main>

    <script>
        // Data Sync Layer (LocalStorage + Initial Seeds)
        let db = JSON.parse(localStorage.getItem('r_db')) || [
            {n:"AeroGlow Facial Wand", r:"Broke after 2 weeks", sc:91},
            {n:"HydraQuench 40oz Tumbler", r:"Leaked constantly", sc:73},
            {n:"FlexiFold Desk Treadmill", r:"Too loud to use", sc:62}
        ];

        // Core Render Function
        function draw() {
            let q = document.getElementById('s').value.toLowerCase();
            document.getElementById('l').innerHTML = db
                .filter(i => i.n.toLowerCase().includes(q))
                .map(i => `
                    <div class="flex justify-between items-center p-3.5 bg-zinc-900/40 border border-zinc-900 rounded-xl hover:border-zinc-800 transition-colors">
                        <div>
                            <h4 class="font-bold text-zinc-200 text-xs">${i.n}</h4>
                            <p class="text-[11px] text-zinc-500 mt-0.5">"${i.r}"</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-mono font-bold ${i.sc > 75 ? 'text-red-500' : 'text-amber-500'}">${i.sc}%</span>
                            <p class="text-[8px] text-zinc-600 uppercase font-bold tracking-wider">Regret</p>
                        </div>
                    </div>
                `).join('');
        }

        // Logic Worker
        function add() {
            let n = document.getElementById('n'), r = document.getElementById('r'), sc = document.getElementById('sc');
            if(n.value && r.value && sc.value) {
                db.unshift({n: n.value, r: r.value, sc: parseInt(sc.value)});
                localStorage.setItem('r_db', JSON.stringify(db));
                draw();
                document.getElementById('f').classList.add('hidden');
                n.value = r.value = sc.value = '';
            } else alert("Fill all fields");
        }

        draw(); // Startup execution
    </script>
</body>
</html>
